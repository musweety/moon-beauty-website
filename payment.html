<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>询价下单 - MOON家居</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">MOON<span>家居</span></a>
    <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="products.html">全部商品</a>
      <a href="contact.html">联系TA</a>
    </nav>
  </div>
</header>

<section class="payment-page">
  <div class="container">
    <div class="section-title">
      <h2>询价下单</h2>
      <p>填写您的信息，我们将尽快与您联系</p>
    </div>
    <div class="payment-wrap">
      <div class="order-summary">
        <h3>商品信息</h3>
        <div id="orderItems">
          <div class="order-item">
            <p style="color:var(--text-light);font-size:14px">请从商品详情页进入下单</p>
          </div>
        </div>
        <div class="order-total">
          <span>预估价格</span>
          <span id="orderTotal">面议</span>
        </div>
      </div>
      <form class="payment-form" onsubmit="submitOrder(event)">
        <h3>联系信息</h3>
        <input type="hidden" id="productId">
        <input type="hidden" id="productNameInput">
        <div class="form-group">
          <label>您的姓名 *</label>
          <input type="text" required placeholder="请输入姓名">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>手机号码 *</label>
            <input type="tel" required placeholder="请输入手机号">
          </div>
          <div class="form-group">
            <label>微信号</label>
            <input type="text" placeholder="请输入微信号">
          </div>
        </div>
        <div class="form-group">
          <label>购买数量</label>
          <select>
            <option>1件（样品）</option>
            <option>2-5件</option>
            <option>5-20件</option>
            <option>20件以上（批发）</option>
          </select>
        </div>
        <div class="form-group">
          <label>备注需求</label>
          <textarea placeholder="请描述您的具体要求，如颜色、材质、尺寸、定制要求等"></textarea>
        </div>
        <button type="submit" class="btn" style="width:100%">提交询价</button>
        <p style="font-size:12px;color:var(--text-light);margin-top:8px;text-align:center">提交后客服将在24小时内与您联系</p>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <h4>MOON家居</h4>
        <p>专业美容椅、家居沙发椅制造商。<br>源头工厂直供，支持定制批发。</p>
      </div>
      <div class="footer-col">
        <h4>快速链接</h4>
        <a href="products.html?category=beauty">美容椅</a>
        <a href="products.html?category=home">家居沙发椅</a>
        <a href="contact.html">联系TA</a>
      </div>
      <div class="footer-col">
        <h4>产品分类</h4>
        <a href="products.html?category=beauty">美容椅系列</a>
        <a href="products.html?category=home">家居沙发椅系列</a>
      </div>
      <div class="footer-col">
        <h4>联系方式</h4>
        <a href="contact.html">在线咨询</a>
        <a href="contact.html">合作洽谈</a>
        <a href="contact.html">定制需求</a>
      </div>
    </div>
    <div class="footer-bottom">
      © 2026 MOON家居 版权所有
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script>
  loadPayment();
  function submitOrder(e) {
    e.preventDefault();
    alert('询价已提交！我们的客服将在24小时内与您联系。');
    e.target.reset();
  }
</script>
</body>
</html>
