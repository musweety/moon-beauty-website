<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系TA - MOON家居</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">MOON<span>家居</span></a>
    <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="products.html">全部商品</a>
      <a href="contact.html" class="active">联系TA</a>
    </nav>
  </div>
</header>

<section class="contact-page">
  <div class="container">
    <div class="section-title">
      <h2>联系我们</h2>
      <p>期待与您的合作，欢迎随时联系我们</p>
    </div>
    <div class="contact-grid">
      <div class="contact-info">
        <h2>MOON家居</h2>
        <p>专业美容椅、家居沙发椅源头工厂。我们提供OEM/ODM定制服务，欢迎各界朋友莅临参观考察。</p>
        <div class="contact-item">
          <div class="icon">📞</div>
          <div><strong>联系电话</strong><br><span style="color:var(--accent);font-size:18px;font-weight:600">18601124986</span></div>
        </div>
        <div class="contact-item">
          <div class="icon">💬</div>
          <div><strong>微信咨询</strong><br><img src="images/moon-wechat.png" alt="微信二维码" style="width:140px;height:140px;object-fit:contain;margin-top:6px;border-radius:8px"></div>
        </div>
        <div class="contact-item">
          <div class="icon">📍</div>
          <div><strong>工厂地址</strong><br>河北省霸州市</div>
        </div>
        <div class="contact-item">
          <div class="icon">📧</div>
          <div><strong>电子邮箱</strong><br>1058219071@qq.com</div>
        </div>
      </div>
      <div class="contact-form">
        <h3 style="margin-bottom:16px">在线留言</h3>
        <form onsubmit="submitContact(event)">
          <div class="form-group">
            <label>您的姓名 *</label>
            <input type="text" required placeholder="请输入姓名">
          </div>
          <div class="form-group">
            <label>联系方式 *</label>
            <input type="text" required placeholder="手机号或微信号">
          </div>
          <div class="form-group">
            <label>留言内容 *</label>
            <textarea id="contactMessage" required placeholder="请描述您的需求，如产品咨询、定制要求等"></textarea>
          </div>
          <button type="submit" class="btn" style="width:100%">发送留言</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <h4>MOON家居</h4>
        <p>专业美容椅、家居沙发椅制造商。<br>源头工厂直供，支持定制批发。</p>
      </div>
      <div class="footer-col">
        <h4>快速链接</h4>
        <a href="products.html?category=beauty">美容椅</a>
        <a href="products.html?category=home">家居沙发椅</a>
        <a href="contact.html">联系TA</a>
      </div>
      <div class="footer-col">
        <h4>产品分类</h4>
        <a href="products.html?category=beauty">美容椅系列</a>
        <a href="products.html?category=home">家居沙发椅系列</a>
      </div>
      <div class="footer-col">
        <h4>联系方式</h4>
        <a href="contact.html">在线咨询</a>
        <a href="contact.html">合作洽谈</a>
        <a href="contact.html">定制需求</a>
      </div>
    </div>
    <div class="footer-bottom">
      © 2026 MOON家居 版权所有
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script>
  initContactForm();
  function submitContact(e) {
    e.preventDefault();
    alert('留言已提交！我们将尽快与您联系。');
    e.target.reset();
  }
</script>
</body>
</html>
